[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbrain-cli"
version = "0.1.0"
description = "Connect a local gbrain-sms PC to the GBrain website dashboard"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gbrain-cli = "gbrain_cli.__main__:main"

[tool.setuptools]
packages = ["gbrain_cli"]
